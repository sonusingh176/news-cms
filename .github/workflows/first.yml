name: News CMS First Workflow
on: push

jobs:
    validate-files:
        runs-on: ubuntu-latest
        steps:
            - name: Get repository code
              uses: actions/checkout@v4

            - name: Check project files
              run: |
                    pwd
                    ls -la
                    git ls-files package-lock.json

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Validate HTML file
              run: test -f index.html

            - name: Validate React entry file
              run: test -f src/main.jsx

            - name: Validate App component
              run: test -f src/App.jsx

            - name: Validate package file
              run: test -f package.json
    
    lint:
        runs-on: ubuntu-latest
        needs:  validate-files

        steps:
            - name: Get repository code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                # cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

    build:
        runs-on: ubuntu-latest
        needs: [validate-files,lint]

        steps:
            - name: Get repository code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                # cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build
